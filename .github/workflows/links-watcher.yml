name: Periodic Link Checker

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@a8c4c7cb88f0c7386610c35eb25108e448569cb0 # v2.7.0
        with:
          args: --verbose --no-progress --max-concurrency 2 --exclude-link-local --exclude-loopback './**/*.md' --exclude portal.azure.com --exclude developers.sap.com --exclude fully.qualified.domainname --exclude terraform.io
          output: ./lychee/out.md
          fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Find existing issue
        id: find_issue
        uses: micalevisk/last-issue-action@0d40124cc99ac8601c2516007f0c98ef3d27537b # v2.3.0
        if: failure()
        with:
          state: open
          labels: |
            broken link
            automated issue
      - name: Create or update issue for broken links
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        if: failure()
        with:
          title: Link Checker Report
          # If issue number is empty a new issue gets created
          issue-number: ${{ steps.find_issue.outputs.issue-number }}
          content-filepath: ./lychee/out.md
          labels: broken link, automated issue